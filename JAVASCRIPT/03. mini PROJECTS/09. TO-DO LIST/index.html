<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <div class="todo-header">
            <h2>To-Do List</h2>
            <p class="todo-subtitle">Keep track of your tasks</p>
        </div>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a task..." autocomplete="off">
            <button id="addBtn">Add</button>
        </div>
        
        <div class="list-section">
            <ul id="taskList"></ul>
        </div>
        
        <div class="action-section">
            <button id="removeLastBtn">Remove Last Task</button>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const removeLastBtn = document.getElementById('removeLastBtn');
        const taskList = document.getElementById('taskList');

        taskInput.addEventListener('input', () => {
            taskInput.classList.remove('input-error');
        });

        addBtn.addEventListener('click', () => {
            const taskText = taskInput.value.trim();

            if (taskText === '') {
                taskInput.classList.remove('input-error');
                void taskInput.offsetWidth; // Trigger reflow for shake animation
                taskInput.classList.add('input-error');
                return;
            }

            const li = document.createElement('li');
            
            const taskSpan = document.createElement('span');
            taskSpan.innerText = taskText;
            li.appendChild(taskSpan);

            const removeBtn = document.createElement('button');
            removeBtn.innerText = 'Remove';

            removeBtn.addEventListener('click', () => {
                li.remove(); 
            });

            li.append(removeBtn);

            taskList.append(li);

            taskInput.value = '';
            taskInput.classList.remove('input-error');
        });

        removeLastBtn.addEventListener('click', () => {
            if (taskList.lastElementChild) {
                taskList.removeChild(taskList.lastElementChild);
            }
        });
    </script>
</body>
</html>
