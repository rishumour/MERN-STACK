<!DOCTYPE html>
<html>
<head>
  <style>
    body { text-align: center; font-family: sans-serif; margin-top: 20vh; }
    h1 { font-size: 5rem; margin: 10px; }
    button { font-size: 2rem; padding: 10px 20px; margin: 5px; cursor: pointer; }
    .reset { font-size: 1.5rem; display: block; margin: 20px auto; }
  </style>
</head>
<body>

  <h1 id="count">0</h1>

  <button onclick="update(-1)">decrement</button>
  <button onclick="update(1)">increment</button>
  <button class="reset" onclick="resetCount()">Reset</button>

  <script>
    let currentCount = 0;
    let display = document.getElementById("count"); 

    function update(value) {
      currentCount += value;
      display.innerText = currentCount;
    }

    function resetCount() {
      currentCount = 0;
      display.innerText = currentCount;
    }
  </script>

</body>
</html>
